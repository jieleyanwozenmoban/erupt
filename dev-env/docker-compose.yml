# Erupt Development Environment Docker Compose
# Supports: MySQL, Redis, and optional services for local development

version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: erupt-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-erupt_dev}
      MYSQL_USER: ${MYSQL_USER:-erupt}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-erupt123}
      TZ: ${TZ:-Asia/Shanghai}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=500
      --innodb_buffer_pool_size=256M
    volumes:
      - mysql_data:/var/lib/mysql
      - ./dev-env/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - erupt-dev-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: erupt-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis123}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - erupt-dev-network

  # Optional: Adminer for database management (comment out if not needed)
  adminer:
    image: adminer:latest
    container_name: erupt-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - erupt-dev-network
    profiles:
      - tools

  # Optional: Redis Commander for Redis management (comment out if not needed)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: erupt-redis-commander
    restart: unless-stopped
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-redis123}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - erupt-dev-network
    profiles:
      - tools

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  erupt-dev-network:
    driver: bridge
